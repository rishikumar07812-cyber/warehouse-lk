<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WAREHOUSE.LK — Marketplace</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0B0F17; color: #FFFFFF; font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; overflow: hidden;
    }
    .app-container {
      width: 100%; max-width: 400px; height: 85vh; max-height: 800px; background: #0F1420;
      border: 2px solid #00BFFF; border-radius: 32px; padding: 20px 16px 85px 16px;
      position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 20px rgba(0, 191, 255, 0.15);
      display: flex; flex-direction: column;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .profile-name { font-size: 18px; font-weight: 700; }
    .post-ad-btn {
      background: linear-gradient(135deg, #00E699, #00BFFF); color: #0B0F17; border: none;
      font-weight: 800; padding: 8px 14px; border-radius: 18px; cursor: pointer;
    }
    .cat-selector { display: flex; background: #182030; border-radius: 20px; padding: 3px; margin-bottom: 10px; gap: 4px; }
    .cat-btn { flex: 1; background: transparent; border: none; color: #8A99AD; font-weight: 700; padding: 8px; border-radius: 16px; cursor: pointer; }
    .cat-btn.active { background: #252D3D; color: #00E699; }
    .search-box {
      background: #18202E; border: 1px solid #253046; border-radius: 16px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .search-box input { background: transparent; border: none; color: #FFF; font-size: 13px; outline: none; width: 100%; }
    #listingsContainer { flex: 1; overflow-y: auto; padding-right: 2px; }
    .listing-card { background: #18202E; border: 1px solid #253046; border-radius: 20px; padding: 14px; margin-bottom: 12px; }
    .bottom-nav { 
      position: absolute; bottom: 10px; left: 14px; right: 14px; background: #121824; border: 1px solid #1E283A; border-radius: 20px; display: flex; justify-content: space-around; padding: 8px 0; z-index: 50; 
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748B; font-size: 10px; text-decoration: none; background: transparent; border: none; cursor: pointer; }
    .nav-item.active { color: #00E699; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 200; justify-content: center; align-items: center; padding: 16px; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="top-bar">
      <div class="profile-name">Sasemi</div>
      <button class="post-ad-btn" onclick="alert('Open post modal')">➕ Post Ad</button>
    </div>
    <div class="cat-selector">
      <button class="cat-btn active" id="tabWarehouse" onclick="switchCategory('WAREHOUSE')">🏭 Warehouses</button>
      <button class="cat-btn" id="tabTransport" onclick="switchCategory('TRANSPORT')">🚚 Transport</button>
    </div>
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="marketSearch" placeholder="Search location or owner..." oninput="handleMarketSearch(this.value)" />
    </div>
    <div id="listingsContainer">
      <div style="text-align: center; color: #8A99AD; padding: 30px;">Loading listings...</div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
      <a href="/dashboard.html" class="nav-item"><span>🏠</span><span>Home</span></a>
      <a href="/marketplace.html" class="nav-item active"><span>🚚</span><span>Market Place</span></a>
      <a href="/stock.html" class="nav-item"><span>📈</span><span>Stock</span></a>
      <button class="nav-item" onclick="openSettingsDrawer()"><span>⚙️</span><span>Setting</span></button>
    </div>

    <!-- SETTINGS & FACILITY RISK DRAWER OVERLAY -->
    <div class="modal-overlay" id="settingsDrawer" style="justify-content:flex-end; padding:0;">
      <div class="drawer-sheet" style="width:100%; max-width:400px; background:#121824; border-top:2px solid #00E699; border-radius:28px 28px 0 0; padding:20px 16px; height:85%; overflow-y:auto; box-sizing:border-box;">
        <div style="width:36px; height:4px; background:#00E699; border-radius:2px; margin:0 auto 16px auto;"></div>
        
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <div style="display:flex; align-items:center; gap:10px;">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" style="width:40px; height:40px; border-radius:50%; border:2px solid #00E699;" alt="Avatar">
            <div style="font-size:18px; font-weight:800; color:#FFF;">Sasemi</div>
          </div>
          <button onclick="closeSettingsDrawer()" style="background:#1E283A; border:none; color:#FFF; width:32px; height:32px; border-radius:50%; cursor:pointer; font-weight:bold;">✕</button>
        </div>

        <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:16px;">
          <div style="background:#18202E; border:1px solid #253046; border-radius:16px; padding:12px; display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-weight:800; font-size:14px;">Kurunegala</div>
              <div style="font-size:10px; color:#8A99AD;">North Western Flood Zone</div>
            </div>
            <div style="background:rgba(255,215,0,0.15); border:1px solid #FFD700; color:#FFD700; font-size:10px; font-weight:800; padding:4px 10px; border-radius:10px;">Moderate Threat</div>
          </div>

          <div style="background:#18202E; border:1px solid #253046; border-radius:16px; padding:12px; display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-weight:800; font-size:14px;">Kandy</div>
              <div style="font-size:10px; color:#8A99AD;">Central Province Mahaweli Basin</div>
            </div>
            <div style="background:rgba(255,77,77,0.15); border:1px solid #FF4D4D; color:#FF4D4D; font-size:10px; font-weight:800; padding:4px 10px; border-radius:10px;">Landslide Alert</div>
          </div>

          <div style="background:#18202E; border:1px solid #253046; border-radius:16px; padding:12px; display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-weight:800; font-size:14px;">Colombo</div>
              <div style="font-size:10px; color:#8A99AD;">Western Coast Canal Zone</div>
            </div>
            <div style="background:rgba(0,230,153,0.15); border:1px solid #00E699; color:#00E699; font-size:10px; font-weight:800; padding:4px 10px; border-radius:10px;">Low Risk</div>
          </div>
        </div>

        <button onclick="window.location.href='/marketplace.html'" style="width:100%; background:#00E699; border:none; color:#0B0F17; font-weight:800; padding:12px; border-radius:16px; cursor:pointer; margin-bottom:8px; font-size:14px;">Add Warehouse</button>
        <button onclick="handleLogout()" style="width:100%; background:transparent; border:1px solid #FF4D4D; color:#FF4D4D; font-weight:800; padding:12px; border-radius:16px; cursor:pointer; margin-bottom:20px; font-size:14px;">Logout</button>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <div style="font-size:14px; font-weight:800; color:#FFF;">Stock 📈</div>
        </div>

        <div style="display:flex; flex-direction:column; gap:8px;">
          <div onclick="window.location.href='/stock.html'" style="background:#18202E; border:1px solid #253046; border-radius:16px; padding:12px 14px; cursor:pointer; font-weight:800; font-size:13px; color:#FFF;">Low Stock</div>
          <div onclick="window.location.href='/stock.html'" style="background:#18202E; border:1px solid #253046; border-radius:16px; padding:12px 14px; cursor:pointer; font-weight:800; font-size:13px; color:#FFF;">Sales</div>
          <div onclick="window.location.href='/stock.html'" style="background:#18202E; border:1px solid #253046; border-radius:16px; padding:12px 14px; cursor:pointer; font-weight:800; font-size:13px; color:#FFF;">Smart storage</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let activeCategory = 'WAREHOUSE';
    let rawListings = [];
    window.onload = async () => { await loadListings(); };

    function switchCategory(cat) {
      activeCategory = cat;
      document.getElementById('tabWarehouse').className = cat === 'WAREHOUSE' ? 'cat-btn active' : 'cat-btn';
      document.getElementById('tabTransport').className = cat === 'TRANSPORT' ? 'cat-btn active' : 'cat-btn';
      loadListings();
    }

    async function loadListings() {
      const res = await fetch(`/api/marketplace/listings?type=${activeCategory}`);
      const data = await res.json();
      if (data.success) {
        rawListings = data.listings;
        renderListings(rawListings);
      }
    }

    function renderListings(items) {
      const container = document.getElementById('listingsContainer');
      if (items.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: #8A99AD; padding: 30px;">No listings available.</div>`;
        return;
      }
      container.innerHTML = items.map(item => `
        <div class="listing-card">
          <div style="font-weight:800; font-size:16px;">${item.location}</div>
          <div style="font-size:12px; color:#8A99AD;">Owner: ${item.ownerName} | 📞 ${item.contactPhone}</div>
        </div>
      `).join('');
    }

    function handleMarketSearch(query) {
      const q = query.toLowerCase();
      renderListings(rawListings.filter(i => i.location.toLowerCase().includes(q) || i.ownerName.toLowerCase().includes(q)));
    }

    function openSettingsDrawer() { document.getElementById('settingsDrawer').style.display = 'flex'; }
    function closeSettingsDrawer() { document.getElementById('settingsDrawer').style.display = 'none'; }
    function handleLogout() { if(confirm('Are you sure you want to logout?')) window.location.href = '/dashboard.html'; }
  </script>
</body>
</html>
