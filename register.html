<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WAREHOUSE.LK — Register</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0B0F19 url('/background.png') no-repeat center center fixed;
      background-size: cover; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative;
    }
    .bg-motion-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11, 15, 25, 0.75) 0%, rgba(11, 15, 25, 0.35) 50%, rgba(11, 15, 25, 0.85) 100%); z-index: 1; pointer-events: none; }
    .content-wrapper { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 480px; padding: 20px; text-align: center; }
    .logo-container { background: rgba(255, 255, 255, 0.95); padding: 12px 24px; border-radius: 24px; box-shadow: 0 0 35px rgba(0, 230, 153, 0.6); border: 2px solid #FFF; margin-bottom: 20px; }
    .logo-container img { height: 42px; width: auto; object-fit: contain; }
    .welcome-text { color: #FFF; font-size: 26px; font-weight: 600; margin-bottom: 20px; text-shadow: 0 4px 15px rgba(0,0,0,0.6); }
    .glass-card { width: 100%; background: rgba(255, 255, 255, 0.22); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 36px 36px 24px 24px; padding: 24px; text-align: left; box-shadow: 0 25px 50px rgba(0,0,0,0.4); }
    .card-title { color: #000; font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .input-group { position: relative; margin-bottom: 12px; }
    .input-field { width: 100%; background: rgba(230, 235, 245, 0.88); border: 1px solid rgba(255, 255, 255, 0.6); color: #000; font-size: 15px; padding: 14px 14px 14px 45px; border-radius: 18px; outline: none; }
    .input-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); }
    .submit-btn { width: 100%; background: #4F46E5; border: none; color: #FFF; font-size: 17px; font-weight: 600; padding: 14px; border-radius: 18px; cursor: pointer; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4); }
    .login-prompt { text-align: center; margin-top: 15px; font-size: 14px; color: #222; }
    .login-prompt a { color: #92400E; font-weight: 700; text-decoration: none; cursor: pointer; }
    .footer { position: relative; z-index: 2; color: #94A3B8; font-size: 13px; margin: 15px 0; text-align: center; }
  </style>
  <script src="/translations.js"></script>
</head>
<body>
  <div class="bg-motion-overlay"></div>
  <div class="content-wrapper">
    <div class="logo-container"><img src="/logo.png" alt="Logo"></div>
    <div class="welcome-text" id="topWelcome">Warehouse.LK</div>

    <div class="glass-card">
      <div class="card-title" id="cardTitleText">Create account for your Warehouse.LK</div>

      <form onsubmit="handleRegister(event)">
        <div class="input-group"><span class="input-icon">👤</span><input type="text" id="fullNameInput" class="input-field" placeholder="Full Name" required /></div>
        <div class="input-group"><span class="input-icon">✉️</span><input type="email" id="emailInput" class="input-field" placeholder="Email Address" required /></div>
        <div class="input-group"><span class="input-icon">🆔</span><input type="text" id="usernameInput" class="input-field" placeholder="Username" required /></div>
        <div class="input-group"><span class="input-icon">📞</span><input type="tel" id="phoneInput" class="input-field" placeholder="Phone Number" required /></div>
        <div class="input-group"><span class="input-icon">🔒</span><input type="password" id="passwordInput" class="input-field" placeholder="Password" required /></div>
        <div class="input-group"><span class="input-icon">🔐</span><input type="password" id="confirmPasswordInput" class="input-field" placeholder="Confirm Password" required /></div>
        <button type="submit" class="submit-btn" id="createAccountBtnText">Create Account</button>
      </form>

      <div class="login-prompt">
        <span id="alreadyHaveAccountText">Already have an account?</span> 
        <a id="backToLoginLink" onclick="goToLogin()">← Back to Login</a>
      </div>
    </div>
  </div>
  <div class="footer">🇱🇰 2026 Warehouse.LK Sri Lanka</div>

  <script>

    let activeLang = 'en';
    window.onload = function() {
      activeLang = getGlobalLang();
      const t = appTranslations[activeLang] || appTranslations.en;

      document.getElementById('cardTitleText').innerText = t.regTitle;
      document.getElementById('fullNameInput').placeholder = t.fullName;
      document.getElementById('emailInput').placeholder = t.emailAddr;
      document.getElementById('usernameInput').placeholder = t.username;
      document.getElementById('phoneInput').placeholder = t.phoneNum;
      document.getElementById('passwordInput').placeholder = t.password;
      document.getElementById('confirmPasswordInput').placeholder = t.confirmPass;
      document.getElementById('createAccountBtnText').innerText = t.createBtn;
      document.getElementById('alreadyHaveAccountText').innerText = t.alreadyHave;
      document.getElementById('backToLoginLink').innerText = t.backLogin;
    };

    function goToLogin() {
      window.location.href = `/login.html?lang=${activeLang}`;
    }

    function handleRegister(event) {
      event.preventDefault();
      window.location.href = `/dashboard.html?lang=${activeLang}`;
    }

    async function handleRegister(event) {
      event.preventDefault();
      
      const payload = {
        fullName: document.getElementById('fullNameInput').value,
        email: document.getElementById('emailInput').value,
        username: document.getElementById('usernameInput').value,
        phone: document.getElementById('phoneInput').value,
        password: document.getElementById('passwordInput').value
      };

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          alert('Account created successfully!');
          window.location.href = `/login.html?lang=${currentLang}`;
        } else {
          alert(data.message || 'Registration failed');
        }
      } catch (err) {
        console.error('Registration error:', err);
        alert('Server connection error.');
      }
    }
  </script>
</body>
</html>
